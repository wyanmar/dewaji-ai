<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan Marked.js untuk merapikan format teks/Markdown dari AI -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Gemini AI Assistant</h2>
            <p>Tanya apa saja seputar artikel atau topik blog ini.</p>
        </div>
        
        <div id="chat-messages" class="chat-messages">
            <div class="message ai-message">Halo! Ada yang bisa saya bantu hari ini?</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Ketik pesanmu di sini..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
